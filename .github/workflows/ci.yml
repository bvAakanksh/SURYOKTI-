name: Verify SURYOKTI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run canonical anomaly-detection tests
        run: python -m unittest discover -s anomaly_detection/tests -v
      - name: Run forecast and adaptive-pipeline checks
        run: |
          python energy_prediction_romania/tests/test_preprocessing.py
          python energy_prediction_romania/tests/test_model.py
          python energy_prediction_adaptive/tests/test_schema_profiler.py
          python energy_prediction_adaptive/tests/test_adaptive_preprocessing.py
          python energy_prediction_adaptive/tests/test_validation_splits.py
          python energy_prediction_adaptive/tests/test_model_arena.py
